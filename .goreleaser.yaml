# Builds the release artifacts and publishes the Homebrew cask that installs
# them. Releases are cut from a laptop rather than CI, so docs/RELEASING.md
# carries the half this file cannot: the tag, the token, and the checks a cask
# has no `test do` to make for us.
# https://goreleaser.com
version: 2
project_name: herdr-scratch
before:
  hooks:
    # First, because it is the gate: herdr reads the manifest's own `version`,
    # not the tag, so a tag that disagrees with it publishes a release claiming
    # to be a version nobody can see. Costs milliseconds and needs no network,
    # which is the other reason it comes before the download.
    - ./.mise/tasks/version-check {{ .Version }} {{ .IsSnapshot }}
    - go mod download
builds:
  - env:
      # Every release cross-compiles three of its four targets from one machine.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # What the tap formula stamped, kept verbatim: -s -w is what std_go_args
    # passed by default, and main.version is what `herdr-scratch --version`
    # reports. This restates goreleaser's own default on purpose rather than
    # inheriting it — the stamp is load-bearing, and a default that quietly
    # changed would leave every release reporting "dev" with nothing to notice
    # it by.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # A path, not just a name. `herdr-scratch link` copies bin/, tmux.conf,
    # shell/ and the manifest out of two directories above the *resolved*
    # executable — Dir(Dir(EvalSymlinks(os.Executable()))), cmd/link.go's
    # buildRoot — and it is that EvalSymlinks which turns the cask's PATH
    # symlink into the staged Caskroom root. A binary at the archive root would
    # leave the extracted tree one level short, and link would fail on a bare
    # `stat .../bin: no such file or directory`.
    #
    # Two defaults hold this up, so leave both alone: strip_binary_directory
    # would flatten the path back out of the archive, and wrap_in_directory
    # would nest the tree one level deeper than the cask's binary stanza looks.
    binary: bin/herdr-scratch
archives:
  # Naming `files` replaces goreleaser's defaults rather than adding to them, so
  # LICENSE is listed back explicitly — MIT requires the notice travel with the
  # binary — and README.md with it. The other three, beside bin/, are what makes
  # the extracted tree a plugin root herdr can actually load.
  #
  # `shell` names the directory rather than a glob under it. A `shell/**/*` here
  # matches nothing — ** wants at least one directory to stand for, and the only
  # file in there sits directly inside — and goreleaser reports that as a log
  # line rather than an error, so the archive would just quietly ship without
  # the shell integration.
  - files:
      - herdr-plugin.toml
      - tmux.conf
      - shell
      - LICENSE
      - README.md
homebrew_casks:
  # A cask rather than a formula, because the archive already holds a built
  # binary and goreleaser's `brews` is soft-deprecated in favour of this. Its
  # sha256 per architecture is read from the checksums.txt goreleaser generates
  # by default. The formula pinned a sha256 too — on the source tarball — so
  # what changed is not that there is a checksum but what it covers: the binary
  # the user actually runs, rather than the source someone else's toolchain
  # rebuilt.
  #
  # Casks are macOS-only — Homebrew on Linux refuses to install one at all — so
  # the linux archives above are for `herdr plugin install` and by-hand
  # extraction. There is no brew path on Linux, and no arrangement of this block
  # creates one.
  - repository:
      owner: macintacos
      name: homebrew-tap
    homepage: https://github.com/macintacos/herdr-scratch
    description: Scratch shell popup for herdr that detaches instead of closing
    license: MIT
    # Spelled out because goreleaser derives the cask's `binary` stanza from the
    # base name alone, which would point Homebrew at a herdr-scratch sitting at
    # the top of the staged directory — where the archive deliberately does not
    # put it. The symlink it makes still lands on PATH as `herdr-scratch`; only
    # its target changes.
    binaries:
      - bin/herdr-scratch
    # Not optional, either of them. herdr is what loads the plugin, and tmux is
    # what keeps the shell alive and the screen intact between one press of the
    # chord and the next.
    dependencies:
      - formula: herdr
      - formula: tmux
    # Registration is the post-install hook's job below, so what is left here is
    # the one thing a cask cannot do for the user: bind a key. `link` closes the
    # block as the repair path for a hook that did not run.
    caveats: |
      Bind a key in ~/.config/herdr/config.toml:

        [[keys.command]]
        key         = "prefix+'"
        type        = "plugin_action"
        command     = "user.scratch.toggle"
        description = "scratch shell"

      and apply it with:

        herdr server reload-config

      Installing registered the plugin with herdr, and every upgrade
      re-registers itself. If the popup ever runs a build you have already
      upgraded past:

        herdr-scratch link
    hooks:
      post:
        # Homebrew quarantines whatever a cask downloads, and macOS refuses to
        # run a quarantined binary from a developer it cannot identify. Only
        # this copy is affected: `herdr-scratch link` copies the tree with plain
        # reads and writes, which carry no extended attributes, so the build the
        # popup runs comes out clean regardless. This is the copy the hook below
        # runs `link` from, which makes it the one that has to run.
        #
        # The `-h` probe is not defensive padding: xattr was a /usr/bin/python3
        # script until recently, and on a machine without the Command Line Tools
        # it fails rather than runs. goreleaser's own docs ship the guard for
        # that reason — a cask that cannot strip the attribute should still
        # install.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bin/herdr-scratch"]
          end
          # Then register the build, so `brew upgrade --cask` delivers it instead
          # of leaving herdr on the release before. The order is fixed, not
          # incidental: this runs the very binary the strip above just cleaned,
          # and macOS will not run a quarantined one at all.
          #
          # `must_succeed: false` is load-bearing rather than defensive. In a
          # cask block `system_command` delegates to SystemCommand.run!, which
          # raises by default, so a failed registration would take the whole
          # `brew upgrade` down with it — when the install itself is fine and
          # only the registration needs redoing by hand.
          #
          # HERDR_BIN_PATH is required for the same kind of reason: bin/brew
          # scrubs its own environment down to PATH=/usr/bin:/bin:/usr/sbin:/sbin,
          # so the Homebrew prefix is not on the PATH this child inherits and
          # `link`'s bare `herdr` lookup would fail on every install. cmd/root.go
          # already reads this variable ahead of PATH, so the hook names herdr
          # through that seam rather than rebuilding a PATH.
          #
          # print_stdout because system_command swallows stdout otherwise, and
          # `link` is the only thing that prints the notice listing settings an
          # older manifest is still carrying. Running it from a hook must not be
          # the reason that notice goes unseen.
          #
          # The same scrub drops XDG_DATA_HOME, and nothing inside brew can
          # recover it, so on a machine that sets it the hook installs to the
          # default $HOME/.local/share/herdr-scratch rather than the root the
          # user's own `herdr-scratch link` would use. That is what `link`
          # surviving as the repair path is for.
          linked = system_command "#{staged_path}/bin/herdr-scratch", args: ["link"],
                                  env: { "HERDR_BIN_PATH" => "#{HOMEBREW_PREFIX}/bin/herdr" },
                                  must_succeed: false, print_stdout: true
          unless linked.success?
            opoo "herdr-scratch link failed, so herdr is still loading the previous build. " \
                 "Run `herdr-scratch link` to register this one."
          end
