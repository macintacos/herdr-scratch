id                = "user.scratch"
name              = "Scratch Shell"
version           = "0.1.0"
min_herdr_version = "0.8.0"
description       = "A scratch shell popup that detaches instead of closing"
platforms         = ["macos", "linux"]

# A plugin pane rather than a `type = "popup"` keybinding, for two reasons.
# Only a plugin pane carries a title, so the border reads "scratch" instead of
# the literal "popup". And a popup keybinding can only ever *open* one, which is
# why binding one to a chord never toggles — bin/herdr-scratch-toggle is a shell
# command that closes an open popup and opens one only when there is none.
#
# tmux, rather than something lighter, because the popup has to come back with
# the contents it had. That needs a session manager which emulates a terminal
# and keeps the screen. abduco and dtach only pipe bytes, so their reattach
# delivers a bare prompt and the previous screen is gone for good.
#
# HERDR_PLUGIN_ROOT is herdr's own pointer at this directory, so the config is
# found wherever the plugin is installed. HERDR_SCRATCH_ROOT re-exports it under
# a name the shell integration can rely on, since HERDR_PLUGIN_ROOT belongs to
# whichever plugin herdr is running at the time.
[[panes]]
id        = "scratch"
title     = "scratch"
placement = "popup"
width     = "70%"
height    = "70%"
command   = [
  "/bin/sh",
  "-c",
  'export HERDR_SCRATCH_POPUP=1 HERDR_SCRATCH_ROOT="$HERDR_PLUGIN_ROOT"; exec tmux -L herdr-scratch -f "$HERDR_PLUGIN_ROOT/tmux.conf" new-session -A -s "${HERDR_SCRATCH_SESSION:-default}"',
]

# The binding users are told to add. Exposing the toggle as an action means
# their config.toml names an action id rather than a path, so it keeps working
# wherever herdr installed this plugin.
[[actions]]
id          = "toggle"
title       = "Toggle scratch shell"
description = "Open the scratch shell popup, or close the open one"
command     = ["./bin/herdr-scratch-toggle"]
