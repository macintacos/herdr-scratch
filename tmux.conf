# Config for the scratch popup's tmux server only — it runs on its own socket
# (-L herdr-scratch), so nothing here touches a tmux you start yourself.
#
# tmux is here for one property nothing lighter has: it emulates a terminal and
# keeps the screen, so re-opening the popup repaints the exact contents that
# were there when it closed. abduco and dtach only pipe bytes — on reattach they
# deliver a bare prompt and the previous screen is gone for good.

# tmux's default prefix is ctrl+b, the same chord herdr uses. Nothing here needs
# tmux's own keys — herdr opens and closes the popup, and detaching happens when
# herdr kills the client — so the prefix is unbound entirely rather than moved.
unbind-key -a
set -g prefix None

# No status bar: this is a plain shell in a popup, not a multiplexer the user
# drives. The row is better spent on output.
set -g status off

# The popup is a fixed size and only ever has one client, so let the session
# follow that client instead of the smallest one that ever attached.
set -g window-size latest
setw -g aggressive-resize on

# Escape belongs to whatever is running in the shell, immediately.
set -g escape-time 0

# Match the outer terminal so colors and styling survive the extra hop.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB"

# Closing the popup kills the client, not the session — that is the whole point.
# But when the shell itself exits, the session should go with it rather than
# linger as an empty session the next open would attach to.
set -g destroy-unattached off
set -g exit-empty on
